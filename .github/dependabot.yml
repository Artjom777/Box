version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/Android/src"
    schedule:
      interval: "weekly"
    groups:
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "com.google.devtools.ksp*"]
      androidx:
        patterns: ["androidx.*"]
      agp:
        patterns: ["com.android.*"]
