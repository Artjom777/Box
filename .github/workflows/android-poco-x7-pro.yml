name: Android APK (POCO X7 Pro)

on:
  workflow_dispatch:
  push:
    paths:
      - "Android/src/**"
      - ".github/workflows/android-poco-x7-pro.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and native submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK tools
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android NDK
        run: sdkmanager "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Build release APK
        working-directory: Android/src
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: box-poco-x7-pro-arm64-apk
          path: Android/src/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
