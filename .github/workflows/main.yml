name: Build Box APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.8.2'

      - name: Filter ARM64-v8a Architecture
        run: |
          # Ограничиваем сборку только архитектурой arm64-v8a (убирает лишние x86/armeabi бинарники)
          find . -name "build.gradle.kts" -exec sed -i 's/ndk {/ndk { abiFilters += listOf("arm64-v8a")/g' {} + || true

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: box-arm64-v8a
          path: "**/build/outputs/apk/**/*.apk"
          2
