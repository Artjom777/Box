name: Build Optimized APK for ARMv9
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true
      - name: Inject ARMv9.2-A and Mali target flags
        run: |
          sed -i 's/abiFilters.*/abiFilters "arm64-v8a"/' app/build.gradle* || true
          OPT_FLAGS="-O3 -march=armv9.2-a+dotprod+fp16+i8mm+sve+sve2 -flto -DGGML_OPENCL=ON -DGGML_VULKAN=ON -DGGML_VK_FORCE_MAX_SUBGROUP_SIZE=64"
          find . -name "CMakeLists.txt" -exec sed -i "1i set(CMAKE_C_FLAGS \"\${CMAKE_C_FLAGS} $OPT_FLAGS\")\nset(CMAKE_CXX_FLAGS \"\${CMAKE_CXX_FLAGS} $OPT_FLAGS\")" {} +
      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: box-optimized-armv9
          path: app/build/outputs/apk/release/*.apk
          
