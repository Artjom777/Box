name: Build Optimized Box for Dimensity 8400
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          link-to-sdk: true

      - name: Fix AGP 9 Kotlin Conflict and Apply Hardware Optimizations
        run: |
          cd Android/src

          # 1. Ликвидация AgpWithBuiltInKotlinAppliedCheck:
          # В AGP 9 встроен нативный Kotlin. Удаляем избыточный плагин kotlin.android, вызывающий падение
          sed -i '/alias(libs.plugins.kotlin.android)/d' app/build.gradle.kts
          sed -i '/id("org.jetbrains.kotlin.android")/d' smollm/build.gradle.kts stablediffusion/build.gradle.kts whisper/build.gradle.kts || true
          sed -i '/kotlin("kapt")/d' app/build.gradle.kts
          sed -i 's/kapt(libs.hilt.android.compiler)/ksp(libs.hilt.android.compiler)/g' app/build.gradle.kts
          sed -i '/kapt/d' app/build.gradle.kts

          # 2. Аппаратные инструкции Cortex-A725 / A720 под чип Dimensity 8400 (ARMv9.2-A)
          # Активируем i8mm (аппаратный тензорный расчет INT8/INT4), sve2 и dotprod
          TARGET_FLAGS="-O3 -march=armv9.2-a+dotprod+fp16+i8mm+sve+sve2 -mcpu=cortex-a725 -flto -fvectorize"
          find . -name "CMakeLists.txt" -exec sed -i "1i set(CMAKE_C_FLAGS \"\${CMAKE_C_FLAGS} $TARGET_FLAGS\")\nset(CMAKE_CXX_FLAGS \"\${CMAKE_CXX_FLAGS} $TARGET_FLAGS\")" {} +

          # 3. Активация GPU Mali-G720 (Vulkan / OpenCL) для всех C++ движков
          sed -i 's/"-DGGML_LLAMAFILE=OFF"/"-DGGML_LLAMAFILE=OFF", "-DGGML_VULKAN=ON", "-DGGML_OPENCL=ON", "-DGGML_VK_FORCE_MAX_SUBGROUP_SIZE=64"/g' smollm/build.gradle.kts || true
          sed -i 's/"-DGGML_VULKAN=OFF"/"-DGGML_VULKAN=ON"/g' whisper/build.gradle.kts || true
          sed -i 's/"-DGGML_OPENCL=OFF"/"-DGGML_OPENCL=ON"/g' whisper/build.gradle.kts || true
          sed -i 's/"-DSD_VULKAN=OFF"/"-DSD_VULKAN=ON"/g' stablediffusion/build.gradle.kts || true

          # 4. Удаление драйверов сторонних NPU (Qualcomm QNN / Google Tensor)
          JNI_DIR="app/src/main/jniLibs/arm64-v8a"
          if [ -d "$JNI_DIR" ]; then
            rm -f "$JNI_DIR"/*Qualcomm* "$JNI_DIR"/*Qnn* "$JNI_DIR"/*GoogleTensor*
          fi

          # 5. Свойства сборщика под целевую платформу
          cat << 'EOF' >> gradle.properties
          android.useAndroidX=true
          android.injected.build.abi=arm64-v8a
          android.overrideVersionCheck=true
          org.gradle.jvmargs=-Xmx6144m
          EOF

          chmod +x ./gradlew

      - name: Build Target APK
        run: |
          cd Android/src
          ./gradlew assembleDebug \
            --no-daemon \
            -Pandroid.injected.build.abi=arm64-v8a \
            --stacktrace

      - name: Upload Chipset-Optimized APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Box-Dimensity8400-Optimized-AllEngines
          path: Android/src/app/build/outputs/apk/**/*.apk
