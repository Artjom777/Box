name: Build Optimized APK for ARMv9
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Build with Root Cause Diagnostics
        run: |
          SETTINGS_FILE=$(find . -maxdepth 3 -name "settings.gradle*" | head -n 1)
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          cd "$PROJECT_DIR"

          echo "=== 1. Проверяем структуру репозитория ==="
          ls -la
          find gradle -type f || true

          # Проверяем версию в gradle-wrapper.properties
          WRAPPER_PROP=$(find . -name "gradle-wrapper.properties" | head -n 1)
          if [ -n "$WRAPPER_PROP" ]; then
            echo "=== Wrapper properties ==="
            cat "$WRAPPER_PROP"
          fi

          # Если gradlew есть в репозитории или подпапках — даем права
          find . -name "gradlew" -exec chmod +x {} +

          # Внедряем аппаратные флаги ARMv9.2-A в CMake
          OPT="-O3 -march=armv9.2-a+dotprod+fp16+i8mm+sve+sve2 -flto"
          find . -name "CMakeLists.txt" -exec sed -i "1i set(CMAKE_CXX_FLAGS \"\${CMAKE_CXX_FLAGS} $OPT\")\nset(CMAKE_C_FLAGS \"\${CMAKE_C_FLAGS} $OPT\")" {} +

          echo "=== 2. Пробуем запуск сборки ==="
          if [ -f "./gradlew" ]; then
            CMD="./gradlew"
          else
            # Если wrapper jar отсутствовал в git, создаем точный wrapper под AGP 8.7+
            gradle wrapper --gradle-version 8.7
            chmod +x ./gradlew
            CMD="./gradlew"
          fi

          $CMD assembleDebug \
            --no-daemon \
            -Dkotlin.experimental.diagnostics.enable=false \
            -Pandroid.injected.build.abi=arm64-v8a \
            --full-stacktrace || {
              echo "=== ТОЧНАЯ ПРИЧИНА ОШИБКИ (FIRST 50 LINES OF ERROR) ==="
              exit 1
            }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: box-optimized-armv9
          path: "**/build/outputs/apk/**/*.apk"
          
