name: Inspect Project
on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show Project Structure and Build Files
        run: |
          echo "=== 1. Поиск gradle файлов ==="
          find . -name "build.gradle*" -o -name "settings.gradle*" -o -name "gradle-wrapper.properties" -o -name "libs.versions.toml"
          
          echo "=== 2. Содержимое gradle-wrapper.properties (если есть) ==="
          cat $(find . -name "gradle-wrapper.properties") 2>/dev/null || echo "gradle-wrapper.properties отсутствует"

          echo "=== 3. Версии плагинов (из libs.versions.toml или корневого build.gradle) ==="
          cat $(find . -name "libs.versions.toml") 2>/dev/null || head -n 30 $(find . -name "build.gradle*" | head -n 1) 2>/dev/null || true

          echo "=== 4. Наличие нативного кода / CMake ==="
          find . -name "CMakeLists.txt" -o -name "Android.mk"
