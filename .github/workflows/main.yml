name: Build Optimized APK for ARMv9
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Detect project wrapper and run build
        run: |
          # Находим корень проекта
          SETTINGS_FILE=$(find . -maxdepth 3 -name "settings.gradle*" | head -n 1)
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          cd "$PROJECT_DIR"

          echo "Working directory: $PWD"

          # Проверяем gradle-wrapper.properties
          WRAPPER_PROP=$(find . -name "gradle-wrapper.properties" | head -n 1)
          if [ -n "$WRAPPER_PROP" ]; then
            echo "Found wrapper properties: $WRAPPER_PROP"
            cat "$WRAPPER_PROP"
            # Извлекаем версию Gradle из URL
            DIST_URL=$(grep "distributionUrl" "$WRAPPER_PROP" | cut -d'=' -f2 | tr -d '\r')
            echo "Target Gradle distribution: $DIST_URL"
          fi

          # Устанавливаем официальный gradle wrapper правильной версии (8.6 — стабильная для большинства AGP 8.3-8.6)
          gradle wrapper --gradle-version 8.6 --distribution-type bin || true
          chmod +x ./gradlew

          OPT="-O3 -march=armv9.2-a+dotprod+fp16+i8mm+sve+sve2 -flto"

          # Запуск сборки
          ./gradlew assembleDebug \
            --no-daemon \
            -Dkotlin.experimental.diagnostics.enable=false \
            -Pandroid.injected.build.abi=arm64-v8a \
            -Pandroid.injected.build.cmake.cflags="$OPT" \
            -Pandroid.injected.build.cmake.cxxflags="$OPT" \
            --info
