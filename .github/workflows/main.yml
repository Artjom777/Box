name: Build Optimized Box APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          link-to-sdk: true

      - name: Patch KAPT and Inject Dimensity 8400 Hardware Flags
        run: |
          cd Android/src

          # 1. Устраняем ClassCastException: удаляем устаревший kapt и переводим hilt на ksp
          sed -i '/kotlin("kapt")/d' app/build.gradle.kts
          sed -i 's/kapt(libs.hilt.android.compiler)/ksp(libs.hilt.android.compiler)/g' app/build.gradle.kts
          sed -i '/kapt/d' app/build.gradle.kts

          # 2. Аппаратные инструкции Cortex-A725 / ARMv9.2-A (i8mm, dotprod, fp16, sve2)
          CHIP_FLAGS="-O3 -march=armv9.2-a+dotprod+fp16+i8mm+sve+sve2 -flto -mcpu=cortex-a725"
          find . -name "CMakeLists.txt" -exec sed -i "1i set(CMAKE_C_FLAGS \"\${CMAKE_C_FLAGS} $CHIP_FLAGS\")\nset(CMAKE_CXX_FLAGS \"\${CMAKE_CXX_FLAGS} $CHIP_FLAGS\")" {} +

          # 3. Активируем аппаратный Vulkan/OpenCL для GPU Mali-G720 в llama.cpp (smollm) и whisper
          sed -i 's/"-DGGML_LLAMAFILE=OFF"/"-DGGML_LLAMAFILE=OFF", "-DGGML_VULKAN=ON", "-DGGML_OPENCL=ON", "-DGGML_VK_FORCE_MAX_SUBGROUP_SIZE=64"/g' smollm/build.gradle.kts || true
          sed -i 's/"-DGGML_VULKAN=OFF"/"-DGGML_VULKAN=ON"/g' whisper/build.gradle.kts || true
          sed -i 's/"-DGGML_OPENCL=OFF"/"-DGGML_OPENCL=ON"/g' whisper/build.gradle.kts || true

          # 4. Удаляем неподдерживаемые драйверы Qualcomm QNN и Tensor TPU, оставляем NPU MediaTek
          JNI_DIR="app/src/main/jniLibs/arm64-v8a"
          if [ -d "$JNI_DIR" ]; then
            rm -f "$JNI_DIR"/*Qualcomm* "$JNI_DIR"/*Qnn* "$JNI_DIR"/*GoogleTensor*
          fi

          # 5. Глушим лишние проверки Gradle
          cat << 'EOF' >> gradle.properties
          android.injected.build.abi=arm64-v8a
          kotlin.experimental.diagnostics.enable=false
          kotlin.suppress.gradle.plugin.binding.errors=true
          android.overrideVersionCheck=true
          org.gradle.jvmargs=-Xmx6144m
          EOF

          chmod +x ./gradlew

      - name: Build Optimized APK
        run: |
          cd Android/src
          ./gradlew assembleDebug \
            --no-daemon \
            -Dkotlin.suppress.gradle.plugin.binding.errors=true \
            -Pandroid.injected.build.abi=arm64-v8a \
            --stacktrace

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Box-Dimensity-8400-arm64
          path: Android/src/app/build/outputs/apk/**/*.apk
          
