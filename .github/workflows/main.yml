name: Build Optimized APK for ARMv9
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Setup Compatible Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Inspect and Prepare Build Directory
        run: |
          SETTINGS_FILE=$(find . -maxdepth 3 -name "settings.gradle*" | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "settings.gradle not found, listing root files:"
            ls -la
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          cd "$PROJECT_DIR"
          
          # Если gradlew уже есть где-то рядом
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build Optimized APK
        run: |
          cd "$PROJECT_DIR"
          OPT="-O3 -march=armv9.2-a+dotprod+fp16+i8mm+sve+sve2 -flto"
          
          # Если есть gradlew — используем его, иначе вызываем системный gradle напрямую
          BUILD_CMD="./gradlew"
          if [ ! -f "./gradlew" ]; then
            BUILD_CMD="gradle"
          fi

          $BUILD_CMD assembleDebug \
            --no-daemon \
            -Pandroid.injected.build.abi=arm64-v8a \
            -Pandroid.injected.build.cmake.cflags="$OPT" \
            -Pandroid.injected.build.cmake.cxxflags="$OPT" \
            --stacktrace

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: box-optimized-armv9
          path: "**/build/outputs/apk/**/*.apk"
          
