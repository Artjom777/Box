name: Build Optimized Box for Dimensity 8400
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Optimize for MediaTek Dimensity
        run: |
          cd Android/src

          # 1. Исправляем версию AGP для совместимости со сборщиком
          if [ -f "gradle/libs.versions.toml" ]; then
            sed -i 's/agp = "9.4.1"/agp = "8.8.2"/g' gradle/libs.versions.toml
          fi

          # 2. Вырезаем библиотеки чужих чипсетов (Qualcomm QNN и Tensor), оставляем только MediaTek
          JNI_DIR="app/src/main/jniLibs/arm64-v8a"
          if [ -d "$JNI_DIR" ]; then
            rm -f "$JNI_DIR"/*Qualcomm*
            rm -f "$JNI_DIR"/*Qnn*
            rm -f "$JNI_DIR"/*GoogleTensor*
            echo "Оставлены нативные библиотеки ускорения:"
            ls -la "$JNI_DIR"
          fi

          # 3. Фиксация настроек Gradle под целевую систему
          cat << 'EOF' >> gradle.properties
          android.injected.build.abi=arm64-v8a
          kotlin.experimental.diagnostics.enable=false
          android.overrideVersionCheck=true
          org.gradle.jvmargs=-Xmx4096m -XX:+UseG1GC
          EOF

          chmod +x ./gradlew

      - name: Compile Target APK
        run: |
          cd Android/src
          ./gradlew assembleDebug \
            --no-daemon \
            -Pandroid.injected.build.abi=arm64-v8a \
            --stacktrace

      - name: Upload Optimized APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Box-Dimensity-arm64-optimized
          path: Android/src/app/build/outputs/apk/**/*.apk
