name: Build Box APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Debug APK with Native Wrapper
        run: |
          # Находим директорию с основным gradlew
          WRAPPER_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -z "$WRAPPER_PATH" ]; then
            echo "gradlew не найден!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$WRAPPER_PATH")
          cd "$PROJECT_DIR"
          chmod +x ./gradlew

          echo "Запуск из каталога: $PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: box-debug-apk
          path: "**/build/outputs/apk/**/*.apk"
          
