name: Build Optimized Box for Dimensity 8400
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          link-to-sdk: true

      - name: Inject ARMv9.2-A & Mali-G720 Hardware Optimizations
        run: |
          cd Android/src

          # 1. Задаем агрессивные аппаратные флаги под архитектуру Dimensity 8400
          TARGET_FLAGS="-O3 -march=armv9.2-a+dotprod+fp16+i8mm+sve+sve2 -flto -mcpu=cortex-a725"
          
          # Пробрасываем флаги архитектуры напрямую во все CMakeLists модулей (smollm, whisper, sd)
          find . -name "CMakeLists.txt" -exec sed -i "1i set(CMAKE_C_FLAGS \"\${CMAKE_C_FLAGS} $TARGET_FLAGS\")\nset(CMAKE_CXX_FLAGS \"\${CMAKE_CXX_FLAGS} $TARGET_FLAGS\")" {} +

          # 2. Включаем ускорение Vulkan и OpenCL для Mali-G720 в llama.cpp и smollm
          sed -i 's/"-DGGML_LLAMAFILE=OFF"/"-DGGML_LLAMAFILE=OFF", "-DGGML_VULKAN=ON", "-DGGML_OPENCL=ON", "-DGGML_VK_FORCE_MAX_SUBGROUP_SIZE=64"/g' smollm/build.gradle.kts || true

          # 3. Убираем лишние NPU-библиотеки чужих чипов (Qualcomm/Tensor), оставляем только MediaTek
          JNI_DIR="app/src/main/jniLibs/arm64-v8a"
          if [ -d "$JNI_DIR" ]; then
            rm -f "$JNI_DIR"/*Qualcomm* "$JNI_DIR"/*Qnn* "$JNI_DIR"/*GoogleTensor*
          fi

          # 4. Обходим сбойную проверку Kotlin/AGP
          cat << 'EOF' >> gradle.properties
          android.injected.build.abi=arm64-v8a
          kotlin.experimental.diagnostics.enable=false
          kotlin.suppress.gradle.plugin.binding.errors=true
          android.overrideVersionCheck=true
          org.gradle.jvmargs=-Xmx6144m
          EOF

          chmod +x ./gradlew

      - name: Compile Native Binaries and APK
        run: |
          cd Android/src
          ./gradlew assembleDebug \
            --no-daemon \
            -Dkotlin.suppress.gradle.plugin.binding.errors=true \
            -Dkotlin.experimental.diagnostics.enable=false \
            -Pandroid.injected.build.abi=arm64-v8a \
            --stacktrace

      - name: Upload Chipset-Optimized APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Box-Dimensity-8400-Optimized
          path: Android/src/app/build/outputs/apk/**/*.apk
