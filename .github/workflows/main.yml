name: Build Optimized APK for ARMv9
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Fix gradlew permissions
        run: chmod +x ./gradlew

      - name: Build Optimized APK
        run: |
          ./gradlew assembleDebug \
            -Pandroid.injected.build.abi=arm64-v8a \
            -Dorg.gradle.cflags="-O3 -march=armv9.2-a+dotprod+fp16+i8mm+sve+sve2 -flto" \
            -Dorg.gradle.cxxflags="-O3 -march=armv9.2-a+dotprod+fp16+i8mm+sve+sve2 -flto" \
            --stacktrace

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: box-optimized-armv9
          path: app/build/outputs/apk/**/*.apk
