name: Build Optimized APK for ARMv9
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Setup Specific Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Patch project and build
        run: |
          SETTINGS_FILE=$(find . -maxdepth 3 -name "settings.gradle*" | head -n 1)
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          cd "$PROJECT_DIR"

          # Принудительно отключаем диагностические проверки Kotlin
          echo "kotlin.experimental.diagnostics.enable=false" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties

          # Находим все файлы CMakeLists.txt и инжектируем флаги под ARMv9.2-A напрямую в CMAKE_CXX_FLAGS
          find . -name "CMakeLists.txt" -exec sed -i '1i set(CMAKE_CXX_FLAGS "${CMAKE_CXX_FLAGS} -O3 -march=armv9.2-a+dotprod+fp16+i8mm+sve+sve2 -flto")\nset(CMAKE_C_FLAGS "${CMAKE_C_FLAGS} -O3 -march=armv9.2-a+dotprod+fp16+i8mm+sve+sve2 -flto")' {} +

          # Запуск сборки через Gradle 8.7
          gradle assembleDebug \
            --no-daemon \
            -Dkotlin.experimental.diagnostics.enable=false \
            -Pandroid.injected.build.abi=arm64-v8a \
            --stacktrace

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: box-optimized-armv9
          path: "**/build/outputs/apk/**/*.apk"
